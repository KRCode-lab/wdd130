<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A contact form which a user can submit to ask questions. This will be an interatctive form where questions about the company and it's services can be answerd .">
    <meta name="author" content="Kirti Ram">
    <title>Contact form</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/background.jpg" alt="River Rafting" width="125" height="125">
        <div id="logo">Rafting Travel</div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <section class="contact-info">
            <h2>Rafting Travels</h2>

            <p>
                Middleland, Arizona<br>
                5 999 000<br>
                <a href="mailto:contact@riverrafting.com">contact@riverrafting.com</a>
            </p>
        </section>


        <section class="contact-grid">
            <div class="map-area">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d29732176.24250625!2d-106.70225777040824!3d44.28467293936502!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1765004125288!5m2!1sen!2sus"
                    width="200" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">

                <fieldset class="message-purpose">
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="Inquiry">General
                        Inquiry</label><br>
                    <label><input type="radio" name="purpose" value="reservation">Reservation
                        Question</label><br>
                    <label><input type="radio" name="purpose" value="suggestion">Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>

                <label>
                    <input type="checkbox"> Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Submit</button>
            </form>
        </section>


        <section class="service">
            <h2>We are here for you!</h2>
        </section>

        <section class="employees">
            <div class="employee-gallery">
                <img src="images/employee1.jpg" alt="Jen" width="100">
                <figcaption>Jenn</figcaption>
            </div>

            <div class="employee-gallery">
                <img src="images/employee2.jpg" alt="Maria" width="100">
                <figcaption>Maria</figcaption>
            </div>

            <div class="employee-gallery">
                <img src="images/employee3.jpg" alt="Brian" width="100">
                <figcaption>Brian</figcaption>
            </div>



        </section>


    </main>

    <footer class="footer">
        <p>&copy; 2025 🚣🏾Rafting Travel🚣🏾 Kirti Ram</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="50">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin Icon" width="50"></a>
        </nav>
    </footer>


</body>

</html>
