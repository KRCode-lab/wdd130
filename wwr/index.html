<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Exlpore the wonders of white river rafting with the best equipmets, guided tours and breathtaking scenary.">
    <meta name="author" content="Kirti Ram">
    <title>About Us and the rafting company name</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/background.jpg" alt="River Rafting" width="125" height="125">
        <div id="logo"></div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>



    <main>
        <div class="hero">
            <img src="images/hero.jpg" alt="Have the time of your life" width="500">
            <h1>Rafting Travel</h1>

            <article class="blur-edges">
                <h2>Experience Exhilration</h2>
                <form>
                    <button type="Book Now">Book Now</button>
                </form>
            </article>
        </div>


        <article class="adventure-heading">
            <h3>We cater for all ages!</h3>

        </article>


        <div class="adventure-image">

            <figure>
                <img src="images/kids.jpg" alt="fun for kids" width="200">
                <figcaption>Fun for kids</figcaption>
            </figure>

            <figure>
                <img src="images/senior-citizen.jpg" alt="senior citizen" width="200">
                <figcaption>Fun for senior citizens</figcaption>
            </figure>

            <figure>
                <img src="images/rapids.jpg" alt="rapids" width="200">
                <figcaption>Fun for thrillers</figcaption>
            </figure>
        </div>

        <div class="heading">
            <h3>Sign up for newsletter</h3>
        </div>

        <div class="subscribe-container">
            <div class="decoration">
                <img src="images/canal.jpg" alt="Exploration" width="250">
            </div>

            <form class="newsletter">


                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group checkbox-container">
                    <label>
                        <input type="checkbox"> Subscribe to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="trips">
            <h3>Trips</h3>
            <p>
                For exciting adventures, visit our
                <a href="trips.html">trips page</a>.
            </p>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; 2025 🚣🏾Rafting Travel🚣🏾 Kirti Ram</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="50">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin Icon" width="50"></a>
        </nav>
    </footer>


</body>

</html>
